# --- MPV General Configuration ---

# Quality settings: Preferred resolution at 1080p or lower
# This prevents unnecessary CPU/GPU load from 4K streaming
ytdl-format="bestvideo[height<=?1080]+bestaudio/best"

# Hardware acceleration: Offloads video decoding to the GPU
hwdec=auto

# Window behavior: Do not close the window after video ends
keep-open=yes

# Resume behavior: Remember the last playback position on quit
save-position-on-quit

# Subtitle language preference (English/Turkish)
slang=en,eng,tr,tur

# Set the initial window size on startup
autofit=75%x75%

# Visual: Hide the window border (cleaner look)
no-border
