# --- MPV Key Bindings ---

# Volume Control: Use arrow keys and mouse wheel
UP            add volume 5
DOWN          add volume -5
WHEEL_UP      add volume 2
WHEEL_DOWN    add volume -2

# Seeking: Navigation
l             seek 10               # 10 seconds forward
j             seek -10              # 10 seconds backward
RIGHT         seek 5                # 5 seconds forward
LEFT          seek -5               # 5 seconds backward

# Playback Control
k             cycle pause           # Toggle play/pause
SPACE         cycle pause           # Toggle play/pause
f             cycle fullscreen      # Toggle fullscreen

# Subtitles: Toggle using 'c'
c             cycle sub-visibility  # Hide or show subtitles

# Playback Speed
]             add speed 0.1         # Increase speed
[             add speed -0.1        # Decrease speed
{             multiply speed 2.0    # Double the speed
}             multiply speed 0.5    # Halve the speed
BS            set speed 1.0         # Reset speed to normal

# Miscellaneous
s             screenshot            # Take a screenshot
q             quit                  # Quit MPV
