# espanso match file

# For a complete introduction, visit the official docs at: https://espanso.org/docs/

# You can use this file to define the base matches (aka snippets)
# that will be available in every application when using espanso.

# Matches are substitution rules: when you type the "trigger" string
# it gets replaced by the "replace" string.

# yaml-language-server: $schema=https://raw.githubusercontent.com/espanso/espanso/dev/schemas/match.schema.json
#
backend: Clipboard

matches:
  - trigger: ":espanso"
    replace: "Hi there!"

  # NOTE: espanso uses YAML to define matches, so pay attention to the indentation!

  # But matches can also be dynamic:

  # Print the output of a shell command
  - trigger: ":shell"
    replace: "{{output}}"
    vars:
      - name: output
        type: shell
        params:
          cmd: "echo 'Hello from your shell'"

  # --- Core & Quick Access ---
  - trigger: ":hi"
    replace: "Hi Okan!"

  - trigger: ":git"
    replace: "o https://github.com/okanbatuk"

  - trigger: ":ff"
    replace: "fastfetch"

  - trigger: ":op"
    replace: "xdg-open ."

  - trigger: ":zed"
    replace: "zeditor "

  - trigger: ":wind"
    replace: "windsurf "

  - trigger: ":go"
    replace: "google.com"

  - trigger: ":alsa"
    replace: "alsamixer"

  # --- Path & Navigation ---
  - trigger: ":proj"
    replace: "~/Desktop/Projects/"

  - trigger: ":priv"
    replace: "~/Desktop/Private/"

  - trigger: ":conf"
    replace: "~/.config"

  # --- Config ---
  - trigger: ":zsh"
    replace: "zshconf"

  - trigger: ":alias"
    replace: "aliasconf"

  - trigger: ":espc"
    replace: "espconf"

  # --- Git Workflow "Magic" ---
  - trigger: ":gs "
    replace: "git status "

  - trigger: ":gc "
    replace: "git commit -m '"

  - trigger: ":gca"
    replace: "git commit -ma '"

  - trigger: ":gbr"
    replace: "git branch"

  - trigger: ":gundo"
    replace: "git reset --soft HEAD~1" # Undo last commit, keep changes

  - trigger: ":gam"
    replace: "git commit --amend -m '"

  - trigger: ":gcln"
    replace: "git branch --merged | grep -v \"\\*\" | xargs -n 1 git branch -d" # Delete local branches already merged into current

  - trigger: ":gup"
    replace: "git remote update && git status -uno" # Fetch remote updates and show status without untracked files

  - trigger: ":gcb"
    replace: "git checkout -b '" # Create a new branch and switch to it immediately

  - trigger: ":gco"
    replace: "git checkout '" # Switch to an existing branch or restore working tree files

  - trigger: ":gp "
    replace: "git push"

  - trigger: ":gpf"
    replace: "git push --force-with-lease"

  - trigger: ":gpull"
    replace: "git pull"

  - trigger: ":gpo"
    replace: "git pull origin $(git branch --show-current)" # Automatically pulls updates from the remote counterpart of your currently active branch.

  - trigger: ":gr "
    replace: "git restore " # Discard changes in local files or restore them from the index

  - trigger: ":gl"
    replace: "git log --oneline -10"

  - trigger: ":gd "
    replace: "git diff " # Show changes between the working directory and the index

  - trigger: ":gdc"
    replace: "git diff --cached" # Show changes that are staged for the next commit

  - trigger: ":gstash"
    replace: "git stash push -m '" # Save local changes to a temporary storage with a descriptive message

  - trigger: ":gsp"
    replace: "git stash pop" # Remove the latest stashed state and apply it to the working directory

  - trigger: ":gtag"
    replace: "git tag '" # Create a specific point in the repository history as being important (usually for releases)

  - trigger: ":gfetch"
    replace: "git fetch --prune" # Download objects/refs from remote and remove any local tracking branches that no longer exist on remote

  - trigger: ":greb"
    replace: "git rebase -i HEAD~" # Open interactive rebase to squash or edit recent commits

  - trigger: ":gign"
    replace: "curl -s https://www.toptal.com/developers/gitignore/api/$|$ >> .gitignore" # Generate .gitignore via Toptal API

  - trigger: ":gh"
    replace: "{{output}}" # Get the 7-character short SHA of the current commit
    vars:
      - name: output
        type: shell
        params:
          cmd: "git rev-parse --short HEAD 2>/dev/null || echo no-repo"

  # --- Backend & API Development ---
  - trigger: ":json"
    replace: "JSON.stringify(data, null, 2)" # Pretty print JSON

  - trigger: ":clg"
    replace: "console.log('🚀 ~ file: , line: ', )" # Enhanced logging for debugging

  - trigger: ":header"
    replace: "Authorization: Bearer "

  - trigger: ":base64"
    replace: 'echo -n "$|$ " | base64' # Base64 encoding utility

  - trigger: ":nr"
    replace: "npm run "

  - trigger: ":br"
    replace: "bun run "

  - trigger: ":ni "
    replace: "npm install "

  - trigger: ":bi"
    replace: "bun install"

  - trigger: ":badd"
    replace: "bun add "

  - trigger: ":nid"
    replace: "npm install -D "

  - trigger: ":nig"
    replace: "npm install -g "

  # --- Docker & K8s Ops ---
  - trigger: ":dps"
    replace: "docker ps"

  - trigger: ":dr"
    replace: "docker run "

  - trigger: ":ds "
    replace: "docker stop "

  - trigger: ":dlogs"
    replace: "docker logs -f "

  - trigger: ":dex"
    replace: "docker exec -it $|$ /bin/sh" # Open an interactive shell inside a running container

  - trigger: ":dstats"
    replace: "docker stats"

  - trigger: ":dclean"
    replace: "docker system prune -af --volumes" # Fully wipe unused Docker data, images, and volumes

  - trigger: ":dbuild"
    replace: "docker build -t "

  - trigger: ":dc"
    replace: "docker-compose "

  - trigger: ":kaf"
    replace: "kubectl apply -f "

  - trigger: ":kgn"
    replace: "kubectl get nodes"

  - trigger: ":kgp"
    replace: "kubectl get pods"

  - trigger: ":kgs"
    replace: "kubectl get svc"

  - trigger: ":kdp"
    replace: "kubectl describe pod "

  - trigger: ":kl"
    replace: "kubectl logs -f "

  # --- Docker Lab (dlab) ---
  - trigger: ":dlup"
    replace: "dlab -ub -n "

  - trigger: ":dls"
    replace: "dlab -s -n "

  - trigger: ":dlt"
    replace: "dlab -t -n "

  - trigger: ":dlr"
    replace: "dlab -r -n "

  - trigger: ":dlx "
    replace: "dlab -x -n "

  - trigger: ":dlxu"
    replace: "dlab -x $|$ -n "

  - trigger: ":dll"
    replace: "dlab -l -n "

  - trigger: ":dlp"
    replace: "dlab -p"

  # --- Manjaro & System Care ---
  - trigger: ":pac"
    replace: "sudo pacman -Syu"

  - trigger: ":psearch"
    replace: "pacman -Ss "

  - trigger: ":orp"
    replace: "pacman -Qdt"

  - trigger: ":mirrors"
    replace: "sudo pacman-mirrors --fasttrack 10 && sudo pacman -Syyu"

  - trigger: ":y "
    replace: "yay -Sua"

  - trigger: ":temp"
    replace: "watch sensors" # Monitor hardware temperatures and fan speeds in real-time

  - trigger: ":path"
    replace: "echo $PATH | tr ':' '\\n'" # Readable PATH environment variable

  - trigger: ":sstat"
    replace: "systemctl status "

  - trigger: ":ss "
    replace: "sudo systemctl start "

  - trigger: ":sstop"
    replace: "sudo systemctl stop "

  - trigger: ":sr "
    replace: "sudo systemctl restart "

  - trigger: ":stime"
    replace: "get-timers"

  - trigger: ":sl "
    replace: "sudo journalctl -u "

  # --- Network & Security ---
  - trigger: ":fw "
    replace: "sudo ufw status"

  - trigger: ":fwa"
    replace: "sudo ufw allow "

  - trigger: ":fwe"
    replace: "sudo ufw enable"

  - trigger: ":fwd"
    replace: "sudo ufw disable"

  - trigger: ":fbs"
    replace: "sudo fail2ban-client status" # Check Fail2Ban status and list banned IP addresses

  - trigger: ":myip"
    replace: "curl -s https://ipinfo.io/ip"

  - trigger: ":port"
    replace: "sudo lsof -i :" # Find which process is occupying a specific network port

  - trigger: ":pingg"
    replace: "ping 8.8.8.8"

  - trigger: ":http"
    replace: "python3 -m http.server 8000"

  # --- Python ---
  - trigger: ":pyt"
    replace: "python3 "

  - trigger: ":pyvers"
    replace: "python3 --version"

  - trigger: ":pipins"
    replace: "pip install "

  - trigger: ":pipf"
    replace: "pip freeze > requirements.txt" # Export all installed Python packages and their versions to a file for reproducibility

  - trigger: ":venv"
    replace: "python3 -m venv venv && source venv/bin/activate" # Create a new virtual environment and activate it in one command

  - trigger: ":activate"
    replace: "source venv/bin/activate"

  # --- File Ops ---
  - trigger: ":cmx"
    replace: "chmod +x "

  - trigger: ":big10"
    replace: "du -ah . | sort -rh | head -n 10" # List the 10 largest files/folders in the directory

  - trigger: ":dir"
    replace: "du -sh */ | sort -rh"

  - trigger: ":ds1"
    replace: "dust -d 1 " # Show visual disk usage tree limited to depth 1

  - trigger: ":ds2"
    replace: "dust -d 2 " # Show visual disk usage tree limited to depth 2

  - trigger: ":ft"
    replace: "fulltree "

  - trigger: ":pt"
    replace: "projtree "

  - trigger: ":findf"
    replace: "find . -type f -name '*"

  - trigger: ":findd"
    replace: "find . -type d -name '*"

  - trigger: ":fdf"
    replace: "fd -t f $|$" # Search for files only

  - trigger: ":fdd"
    replace: "fd -t d $|$" # Search for directories only

  - trigger: ":fda"
    replace: "fd -IH $|$" # Include hidden and ignored files in search

  # --- Compression ---
  - trigger: ":tar"
    replace: "tar -czvf "

  - trigger: ":untar"
    replace: "tar -xzvf "

  - trigger: ":zip"
    replace: "zip -r "

  - trigger: ":unzip"
    replace: "unzip "

  # --- Disk & Mem ---
  - trigger: ":disk"
    replace: "df -h"

  - trigger: ":mem"
    replace: "free -h"

  - trigger: ":top"
    replace: "htop"

  # --- Date & Time & Shell ---
  - trigger: ":date"
    replace: "{{out}}"
    vars:
      - name: fmt
        type: choice
        params:
          values: ["%b %-d, %Y", "%Y-%m-%d", "%d/%m/%Y"]
      - name: out
        type: date
        params:
          format: "{{fmt}}"

  - trigger: ":time"
    replace: "{{time}}"
    vars:
      - name: time
        type: shell
        params:
          cmd: "date +%T"

  - trigger: ":hm"
    replace: "{{hm}}"
    vars:
      - name: hm
        type: shell
        params:
          cmd: "date +%H:%M"

  - trigger: ":iso"
    replace: "{{iso}}"
    vars:
      - name: iso
        type: shell
        params:
          cmd: "date -Iseconds"

  - trigger: ":cdir"
    replace: "cd ~/Desktop/{{path}}"
    vars:
      - name: path
        type: form
        params:
          layout: horizontal
          label: "Path under ~/Desktop"

  - trigger: ":res"
    replace: "reload"

  - trigger: ":ex"
    replace: "exit"

  # --- Sys Info ---
  - trigger: ":si "
    replace: "inxi -Fxzc0"

  - trigger: ":fi "
    replace: "get-info --full"

  - trigger: ":mi "
    replace: "get-info"

  - trigger: ":li "
    replace: "get-info --light"

  - trigger: ":size"
    replace: "du -sh "

  - trigger: ":ls"
    replace: "journalctl --disk-usage"

  - trigger: ":curlj"
    replace: "curl -s "

  - trigger: ":ul "
    replace: "sudo usbguard list-devices" # View authorized/blocked USB devices via USBGuard

  - trigger: ":ua "
    replace: "sudo usbguard allow-device "

  # --- Espanso Triggers ---
  - trigger: ":esps"
    replace: "espanso start"

  - trigger: ":espr"
    replace: "espanso restart"

  - trigger: ":esp "
    replace: "esp_hints"

  - trigger: ":ehints"
    replace: "esp_hints"

  # --- Zen Browser Shortcuts ---
  - trigger: ":zen"
    replace: "zen_hints"

  - trigger: ":zhints"
    replace: "zen_hints"

