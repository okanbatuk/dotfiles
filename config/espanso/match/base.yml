# espanso match file

# For a complete introduction, visit the official docs at: https://espanso.org/docs/

# You can use this file to define the base matches (aka snippets)
# that will be available in every application when using espanso.

# Matches are substitution rules: when you type the "trigger" string
# it gets replaced by the "replace" string.

# yaml-language-server: $schema=https://raw.githubusercontent.com/espanso/espanso/dev/schemas/match.schema.json
#
backend: Clipboard

matches:
  - trigger: ":espanso"
    replace: "Hi there!"

  # NOTE: espanso uses YAML to define matches, so pay attention to the indentation!

  # But matches can also be dynamic:

  # Print the current active shell and kernel version
  - trigger: ":shell"
    replace: "Shell: {{shell_name}} | Kernel: {{kernel_ver}}"
    vars:
      - name: shell_name
        type: shell
        params:
          cmd: "echo $SHELL | awk -F/ '{print $NF}'"
      - name: kernel_ver
        type: shell
        params:
          cmd: "uname -r"

  # --- Core & Quick Access ---
  - trigger: ":hi"
    replace: "Hi Okan!"

  - trigger: ":git"
    replace: "o https://github.com/okanbatuk"

  - trigger: ":go"
    replace: "google.com"

  # --- Config ---
  - trigger: ":zsh"
    replace: "zshconf"

  - trigger: ":alias"
    replace: "aliasconf"

  - trigger: ":espc"
    replace: "espconf"

  # --- Git Workflow "Magic" ---
  - trigger: ":gign"
    replace: "curl -s https://www.toptal.com/developers/gitignore/api/$|$ >> .gitignore"

  - trigger: ":gh"
    replace: "{{output}}"
    vars:
      - name: output
        type: shell
        params:
          cmd: "git rev-parse --short HEAD 2>/dev/null || echo no-repo"

  # --- Backend & API Development ---
  - trigger: ":json"
    replace: "JSON.stringify(data, null, 2)"

  - trigger: ":clg"
    replace: "console.log('🚀 ~ file: , line: ', )"

  - trigger: ":header"
    replace: "Authorization: Bearer "

  - trigger: ":base64"
    replace: 'echo -n "$|$ " | base64'

  # --- Docker ---
  - trigger: ":dex"
    replace: "docker exec -it $|$ /bin/sh"

  # --- Docker Lab (dlab) ---
  - trigger: ":dlxu"
    replace: "dlab -x $|$ -n "

  # --- Manjaro & System Care ---
  - trigger: ":stime"
    replace: "get-timers"

  - trigger: ":jl"
    replace: "jlog-size"

  # --- 2FA Workflow ---
  - trigger: ":aegis"
    replace: "Aegis > Export > JSON > Encrypt: OFF > Save to Syncthing"

  # --- Date & Time & Shell ---
  - trigger: ":date"
    replace: "{{out}}"
    vars:
      - name: fmt
        type: choice
        params:
          values: ["%b %-d, %Y", "%Y-%m-%d", "%d/%m/%Y"]
      - name: out
        type: date
        params:
          format: "{{fmt}}"

  - trigger: ":time"
    replace: "{{time}}"
    vars:
      - name: time
        type: shell
        params:
          cmd: "date +%T"

  - trigger: ":hm"
    replace: "{{hm}}"
    vars:
      - name: hm
        type: shell
        params:
          cmd: "date +%H:%M"

  - trigger: ":iso"
    replace: "{{iso}}"
    vars:
      - name: iso
        type: shell
        params:
          cmd: "date -Iseconds"

  - trigger: ":cdir"
    replace: "cd ~/Desktop/{{path}}"
    vars:
      - name: path
        type: form
        params:
          layout: horizontal
          label: "Path under ~/Desktop"

